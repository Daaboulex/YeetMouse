name: Integration (Install + Uninstall + Test)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libglfw3-dev dkms "linux-headers-$(uname -r)"

      - name: Run install script
        env:
          SUDO_USER: runner
        run: |
          chmod +x ./install.sh
          ./install.sh

      - name: Check if necessary files were created
        run: |
          test -f /sys/module/yeetmouse/parameters/AccelerationMode
          test -f /etc/yeetmouse.conf
          test -f /usr/lib/systemd/system/yeetmouse.service
          yeetmousectl dump | grep -q "accelMode"

      - name: Check profiles, devices and a killed game's claim on the live driver
        run: |
          test -c /dev/yeetmouse
          test -d /etc/yeetmouse/profiles
          sudo yeetmousectl profile save probe /etc/yeetmouse.conf
          sudo yeetmousectl device set 1234:5678 probe
          sudo yeetmousectl load
          sudo yeetmousectl device remove 1234:5678
          sudo yeetmousectl run probe -- sleep 120 &
          sleep 2
          if sudo yeetmousectl profile remove probe; then
            echo "a profile a running game claims was removed"
            exit 1
          fi
          sudo pkill -KILL -f "yeetmousectl run probe"
          sleep 1
          sudo yeetmousectl profile remove probe

      - name: Check the driver skips generic uinput devices and takes real ones
        run: |
          gcc -Wall -Werror -o uinput_mouse tests/uinput_mouse.c
          sudo modprobe uinput
          sudo ./uinput_mouse 0001 yeetmouse-probe-generic
          sudo ./uinput_mouse 046d yeetmouse-probe-real
          log=$(sudo dmesg)
          grep -F "skipping incompatible device yeetmouse-probe-generic" <<< "$log"
          grep -F "found a possible mouse yeetmouse-probe-real" <<< "$log"
          if grep -F "found a possible mouse yeetmouse-probe-generic" <<< "$log"; then
            echo "the driver took a generic uinput device"
            exit 1
          fi

      - name: Run uninstall script
        env:
          SUDO_USER: runner
        run: |
          sudo ./uninstall.sh --purge-config